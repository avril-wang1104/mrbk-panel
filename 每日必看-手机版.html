<style>
/* ===== 每日必看 · 面板样式（浅色主题） ===== */
:root{
  --bg:#f6f5f2;
  --card:#ffffff;
  --ink:#1f2328;
  --ink2:#3d4450;
  --muted:#7a828e;
  --line:#e9e5de;
  --line2:#d9d4ca;
  --accent:#12805c;
  --accent-soft:#e6f4ef;
  --warm:#e07a5f;
  --warm-soft:#fdeee8;
  --purple:#a855f7;
  --purple-soft:#f5e9ff;
  --blue:#3b82f6;
  --blue-soft:#e8f1ff;
  --gold:#b8860b;
  --gold-soft:#fdf5e0;
  --radius:16px;
  --shadow:0 1px 2px rgba(31,35,40,.04), 0 8px 24px rgba(31,35,40,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  font-size:15px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}

/* ---- 顶栏 ---- */
.topbar{
  position:sticky;top:0;z-index:50;
  background:rgba(246,245,242,.88);
  backdrop-filter:saturate(150%) blur(12px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1240px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto;}
.brand h1{font-size:20px;margin:0;letter-spacing:.5px;}
.brand .sub{font-size:12px;color:var(--muted);}

.datenav{display:flex;align-items:center;gap:8px;}
.datenav > button:not(.toolbtn){
  border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;
  transition:.15s;flex-shrink:0;
}
.datenav > button:not(.toolbtn):hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.datenav > button:not(.toolbtn):disabled{opacity:.35;cursor:not-allowed;}
.datenav > .toolbtn{width:auto;height:auto;flex-shrink:0;}
.datesel{
  border:1px solid var(--line2);background:var(--card);border-radius:10px;
  padding:6px 10px;font-size:14px;color:var(--ink);cursor:pointer;min-width:150px;
}
.toolbtn{
  border:1px solid var(--line2);background:var(--card);color:var(--ink2);
  border-radius:10px;padding:7px 12px;font-size:13px;cursor:pointer;transition:.15s;
  white-space:nowrap;
}
.toolbtn:hover{border-color:var(--accent);color:var(--accent);}
.toolbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600;}

/* ---- 手机端顶栏：品牌一行，日期+今天+更新同行不换行，编辑行在其后 ---- */
@media (max-width:640px){
  .topbar-inner{padding:8px 10px;gap:7px;}
  .brand{flex-basis:100%;margin-right:0;}
  .datenav{flex-wrap:nowrap;width:100%;gap:5px;}
  .datenav > button:not(.toolbtn){width:28px;height:30px;font-size:14px;border-radius:8px;}
  .datesel{flex:1 1 auto;min-width:0;width:auto;padding:4px 6px;font-size:13px;border-radius:8px;}
  .datenav > .toolbtn{padding:5px 9px;font-size:12px;border-radius:8px;}
  .topbar-inner > .toolbtn{padding:5px 10px;font-size:12px;}
}

/* ---- 主体 ---- */
.wrap{max-width:1240px;margin:0 auto;padding:22px 20px 60px;}
.hero{
  background:linear-gradient(135deg,#ffffff 0%,#fdfaf6 100%);
  border:1px solid var(--line);border-radius:var(--radius);
  padding:20px 22px;box-shadow:var(--shadow);margin-bottom:20px;
  display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start;
}
.hero-date{font-size:26px;font-weight:700;letter-spacing:.5px;}
.hero-week{font-size:13px;color:var(--muted);margin-left:8px;font-weight:400;}
.hero-line{margin-top:6px;color:var(--ink2);font-size:15px;max-width:760px;}
.hero-meta{text-align:right;font-size:12px;color:var(--muted);line-height:1.9;white-space:nowrap;}
.upd-status{text-align:right;font-size:12px;color:var(--muted);line-height:1.7;margin-top:6px;padding:4px 9px;background:rgba(255,255,255,.16);border-radius:7px;display:inline-block;float:right;clear:both;}
.upd-status:empty{display:none;}
.upd-status .upd-busy{color:#e8f5f0;}
.upd-status .upd-err{color:#ffd9d2;}
.badge{
  display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;
  background:var(--accent-soft);color:var(--accent);margin-left:8px;vertical-align:middle;
}
.badge.warn{background:var(--gold-soft);color:var(--gold);}
.badge.add{background:var(--blue-soft);color:var(--blue);}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:18px;}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:18px 20px;display:flex;flex-direction:column;
}
.col-7{grid-column:span 7;}
.col-5{grid-column:span 5;}
.col-4{grid-column:span 4;}
.col-12{grid-column:span 12;}
@media(max-width:980px){
  .col-7,.col-5,.col-4{grid-column:span 12;}
}

.card-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.card-ico{
  width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:17px;flex:none;
}
.card-title{font-size:16px;font-weight:700;letter-spacing:.3px;}
.card-note{font-size:12px;color:var(--muted);margin-left:auto;}

/* 模块配色 */
.c-green .card-ico{background:var(--accent-soft);}
.c-orange .card-ico{background:var(--warm-soft);}
.c-purple .card-ico{background:var(--purple-soft);}
.c-blue .card-ico{background:var(--blue-soft);}
.c-gold .card-ico{background:var(--gold-soft);}

/* ---- 早报条目 ---- */
.news-item{padding:11px 0;border-bottom:1px dashed var(--line);}
.news-item:last-child{border-bottom:none;padding-bottom:0;}
.news-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tag{
  font-size:11px;padding:1px 8px;border-radius:6px;background:var(--blue-soft);color:var(--blue);flex:none;
}
.tag.r{background:var(--warm-soft);color:var(--warm);}
.tag.g{background:var(--accent-soft);color:var(--accent);}
.tag.p{background:var(--purple-soft);color:var(--purple);}
.news-title{font-weight:600;font-size:15px;color:var(--ink);}
.news-src{font-size:12px;color:var(--muted);}
.news-sum{font-size:13.5px;color:var(--ink2);margin-top:3px;}

/* ---- 健康指标 ---- */
/* ---- 早报（完整版） ---- */
.news-block{padding:12px 0;border-bottom:1px dashed var(--line);}
.news-block:last-of-type{border-bottom:none;}
.news-hd{display:flex;align-items:flex-start;gap:8px;}
.news-hd .no{
  flex:none;background:var(--blue-soft);color:var(--blue);border-radius:6px;
  padding:0 7px;font-size:12.5px;margin-top:3px;
}
.news-title{font-weight:600;font-size:15px;color:var(--ink);flex:1;}
.news-body{font-size:13.5px;color:var(--ink2);margin-top:4px;line-height:1.75;}
.comment{
  margin-top:5px;padding:7px 11px;border-radius:9px;background:#faf9f6;
  border-left:2.5px solid var(--warm);font-size:13px;color:#8a6a55;line-height:1.7;
}
.news-link{margin-top:4px;font-size:12.5px;}
.weather{
  margin-top:12px;padding:11px 13px;border-radius:12px;
  background:var(--blue-soft);border:1px solid #dbe8fb;
}
.w-top{font-size:14px;font-weight:600;color:#1e4d91;}
.w-city{color:#1e4d91;}
.w-temp{margin-left:6px;color:var(--ink2);font-weight:400;}
.w-note{font-size:12.8px;color:#4a5a75;margin-top:3px;line-height:1.7;}

/* ---- 营养知识 ---- */
.theme-tag{
  display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;
  background:var(--accent-soft);color:var(--accent);margin-bottom:8px;
}
.nutri-body{font-size:14px;color:var(--ink2);line-height:1.85;}

/* ---- 今日一句 ---- */
.quote{
  margin:0;padding:14px 16px;border-radius:12px;background:#fdfaf6;
  border-left:3px solid var(--warm);font-size:16px;line-height:1.85;color:var(--ink);
}
.quote-by{text-align:right;font-size:13px;color:var(--muted);margin-top:8px;}
.c-warm .card-ico{background:var(--warm-soft);}

.accent-note{font-size:12.5px;color:var(--muted);}
.src-note{
  font-size:12.3px;color:var(--muted);margin-bottom:11px;padding:5px 11px;
  border-radius:9px;background:#faf9f6;border:1px solid var(--line);display:inline-block;
}
.sec-split{
  margin:16px 0 10px;padding-top:12px;border-top:1px dashed var(--line2);
  font-size:12.5px;font-weight:600;color:var(--muted);letter-spacing:.4px;
}
/* ---- 长文排版（整页版） ---- */
.lf-title{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:9px;color:var(--ink);}
.lf-lead{
  font-size:14.2px;color:var(--ink);line-height:1.85;margin-bottom:12px;
  padding:10px 14px;border-radius:11px;background:#faf8f3;border:1px solid #f0eae0;
}
.lf-h{
  font-size:14.6px;font-weight:700;color:var(--accent);margin-top:14px;
  padding-left:9px;border-left:3px solid var(--accent);line-height:1.6;
}
.lf-p{font-size:14.1px;color:var(--ink2);line-height:1.9;margin:5px 0 0;}
.col-12 .lf-p,.col-12 .lf-lead{max-width:1000px;}
.lf-ul{margin:12px 0 0;padding-left:19px;}
.lf-ul li{font-size:14px;color:var(--ink2);margin:5px 0;line-height:1.8;}
.lf-ul li::marker{color:var(--accent);}

.metric-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin-bottom:14px;}
.metric{
  border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:#fcfbf9;
}
.metric .lb{font-size:11.5px;color:var(--muted);}
.metric .vl{font-size:19px;font-weight:700;line-height:1.4;}
.metric .un{font-size:11.5px;color:var(--muted);font-weight:400;margin-left:2px;}
.metric.good .vl{color:var(--accent);}
.metric.mid .vl{color:var(--gold);}
.metric.low .vl{color:var(--warm);}
.metric.purple .vl{color:var(--purple);}
.cyclebar{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:11px;
  background:var(--purple-soft);margin-bottom:12px;font-size:13px;
}
.cyclebar .dot{width:10px;height:10px;border-radius:50%;background:var(--purple);flex:none;}
.advice{margin:0;padding-left:18px;}
.advice li{margin:4px 0;font-size:14px;color:var(--ink2);}
.advice li::marker{color:var(--accent);}
.para{font-size:14px;color:var(--ink2);margin:6px 0;}

/* ---- 日程待办 ---- */
.todo{
  display:flex;align-items:flex-start;gap:9px;padding:8px 0;
  border-bottom:1px dashed var(--line);
}
.todo-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 26px;}
@media(max-width:760px){.todo-grid{grid-template-columns:1fr;}}
.todo:last-child{border-bottom:none;}
.todo .tm{
  font-size:12px;color:var(--accent);background:var(--accent-soft);
  border-radius:7px;padding:1px 8px;flex:none;min-width:62px;text-align:center;
}
.todo .tx{font-size:14px;color:var(--ink2);}
.todo.done .tx{text-decoration:line-through;color:var(--muted);}
.todo .ck{
  width:17px;height:17px;border:1.6px solid var(--line2);border-radius:5px;cursor:pointer;flex:none;margin-top:4px;
  display:grid;place-items:center;font-size:11px;color:#fff;
}
.todo.done .ck{background:var(--accent);border-color:var(--accent);}

/* ---- 每日一个为什么 ---- */
.why-q{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:10px;color:var(--ink);}
.why-a{font-size:14.5px;color:var(--ink2);}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;}
.chip{font-size:11.5px;padding:2px 9px;border-radius:999px;background:#f1efe9;color:var(--muted);}

/* ---- 好书快读 ---- */
.book-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:10px;}
.book-cover{
  width:46px;height:62px;border-radius:6px;flex:none;
  background:linear-gradient(150deg,var(--warm) 0%,#c2563a 100%);
  display:grid;place-items:center;color:#fff;font-size:11px;padding:4px;text-align:center;line-height:1.3;
}
.book-no{font-size:11.5px;color:var(--gold);font-weight:600;letter-spacing:.3px;}
.book-title{font-size:16px;font-weight:700;}
.book-author{font-size:12.5px;color:var(--muted);}
.book-chapters{
  font-size:12.2px;color:var(--muted);margin-top:9px;padding:6px 10px;
  border-radius:9px;background:#faf8f3;border:1px solid #f0eae0;
}
.book-lead{
  font-size:14.2px;color:var(--ink);margin-top:9px;line-height:1.8;font-weight:600;
}
.bestline{
  margin-top:11px;padding:11px 14px;border-radius:11px;
  background:var(--gold-soft);border-left:3px solid var(--gold);
  font-size:14px;color:#7a5c12;line-height:1.8;
}
.book-points{margin:8px 0 0;padding-left:18px;}
.book-points li{font-size:14px;color:var(--ink2);margin:5px 0;}
.takeaway{
  margin-top:12px;padding:10px 13px;border-radius:11px;background:var(--warm-soft);
  font-size:13.5px;color:#8a4b34;border-left:3px solid var(--warm);
}

/* ---- 今日星盘 ---- */
.astro-top{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;}
.astro-chart{flex:0 0 240px;max-width:240px;}
.astro-svg{width:100%;height:auto;display:block;}
.astro-chart-cap{font-size:11.5px;color:var(--muted);line-height:1.6;margin-top:6px;}
.astro-facts{flex:1 1 380px;min-width:280px;}
.astro-pt{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:10px;}
.astro-pt .ap{
  font-size:12.5px;color:var(--ink2);background:#fbf9f5;border:1px solid var(--line);
  border-radius:9px;padding:3px 10px;
}
.astro-pt .ap i{font-style:normal;color:var(--purple);margin-right:4px;}
.astro-pt .rx{color:#c0392b;font-size:11px;margin-left:4px;}
.astro-ln{font-size:13.8px;color:var(--ink2);line-height:1.85;}
.astro-ln b{color:var(--ink);font-weight:700;margin-right:4px;}
.sign-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;}
.sign-card{
  border:1px solid var(--line);border-radius:13px;padding:12px 13px;background:#fdfcf9;
}
.sign-card.favo{border-color:var(--purple);background:var(--purple-soft);}
.sg-head{display:flex;align-items:baseline;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
.sg-g{font-size:17px;color:var(--purple);}
.sg-n{font-size:15px;font-weight:700;}
.sg-fav{
  font-size:11px;color:#fff;background:var(--purple);border-radius:999px;padding:1px 8px;
}
.sg-r{font-size:11.5px;color:var(--muted);}
.sg-star{margin-left:auto;font-size:12px;color:var(--gold);letter-spacing:1px;}
.sg-l{font-size:13.2px;color:var(--ink2);line-height:1.75;margin-top:4px;}
.sg-l b{color:var(--ink);font-weight:700;margin-right:6px;}
.sg-lucky{
  margin-top:8px;font-size:11.8px;color:var(--muted);border-top:1px dashed var(--line2);
  padding-top:6px;
}
.astro-foot{font-size:11.8px;color:var(--muted);margin-top:12px;line-height:1.7;}
@media(max-width:640px){
  .astro-chart{flex:1 1 100%;max-width:220px;margin:0 auto;}
  .sign-grid{grid-template-columns:1fr;}
}

/* ---- 编辑交互 ---- */
.ed{border-radius:5px;transition:background .15s,box-shadow .15s;}
body.editmode .ed{cursor:text;background:#fdfbf5;box-shadow:0 0 0 1px var(--line2) inset;}
body.editmode .ed:hover{background:#fdf3e2;box-shadow:0 0 0 1px var(--warm) inset;}
.ed:focus{outline:none;background:#fff8ea !important;box-shadow:0 0 0 2px var(--warm) inset;}
.ed-ph{color:var(--muted);font-style:italic;}
body:not(.editmode) .addrow,body:not(.editmode) .delbtn{display:none;}
.addrow{
  margin-top:10px;border:1px dashed var(--line2);border-radius:10px;background:#fcfbf9;
  padding:6px 10px;font-size:13px;color:var(--muted);cursor:pointer;text-align:center;
}
.addrow:hover{border-color:var(--warm);color:var(--warm);}
.delbtn{
  border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:14px;
  padding:0 4px;margin-left:auto;flex:none;
}
.delbtn:hover{color:#d64545;}
.rowwrap{display:flex;align-items:flex-start;gap:6px;}
.rowwrap>div:first-child,.rowwrap>span:first-child{flex:1;min-width:0;}

.empty{
  color:var(--muted);font-size:13.5px;padding:14px;text-align:center;
  border:1px dashed var(--line2);border-radius:11px;background:#fcfbf9;
}

.footer{
  max-width:1240px;margin:26px auto 0;padding:0 20px;
  color:var(--muted);font-size:12.5px;line-height:1.9;
}
.toast{
  position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(12px);
  background:var(--ink);color:#fff;padding:9px 18px;border-radius:10px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.25s;z-index:99;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media print{
  .topbar,.footer,.addrow,.delbtn,.toast{display:none !important;}
  body{background:#fff;}
  .card{break-inside:avoid;box-shadow:none;}
}

</style>

    sections: [
      { h: "一、睡眠不是一条直线，而是一串循环", p: "整夜睡眠由 4~6 个周期串成，每个周期约 90 分钟，顺序是：浅睡（N1、N2）→ 深睡（N3）→ 快速眼动期（REM）。前半夜深睡占比高，后半夜 REM 占比高，所以睡眠的价值分布是不均匀的——砍掉前半夜一小时，和砍掉清晨一小时，代价完全不同。这也是为什么「补觉」很难补回质量：补的多半是清晨那截以 REM 为主的睡眠，深睡补不回来。" },
      { h: "二、深睡才是真正「修车」的时间", p: "成年人的深睡通常占总睡眠的 13%~23%。这段时间是身体的维修窗口：生长激素在此阶段的分泌量占全天的一半以上，负责组织修复与肌肉重建；脑部的类淋巴系统在这时加速冲刷代谢废物；免疫系统的细胞因子调节也在这一段完成。所以如果深睡只有 40 分钟、占比掉到 8% 左右，哪怕总时长睡满 8 小时，第二天依然会觉得身体发沉、反应慢半拍——维修根本没做完，车就被开出去了。" },
      { h: "三、REM 管的是情绪和记忆", p: "REM 占总睡眠的 20%~25%，负责把白天的信息归档、把情绪「去敏」。它也最容易被人自己的行为切碎：睡前饮酒会让前半夜深睡增加、后半夜 REM 被强烈抑制；睡得太晚会直接砍掉 REM 最密集的清晨时段；打鼾或呼吸暂停造成的微觉醒会把 REM 打断成一截一截。REM 不足的典型表现不是困，而是「睡够了但情绪容易炸、开会容易走神、学过的东西记不牢」。" },
      { h: "四、把分数拉起来的四个抓手", p: "第一，固定起床时间比固定入睡时间更有效——起床时间锚定的是昼夜节律的起点，困意会在其后 14~16 小时自然出现。第二，起床后尽快接触自然光 5~10 分钟，晨光抑制褪黑素并校准节律，效果远好于睡前十分钟关灯。第三，咖啡因半衰期 3~6 小时，下午两点后停杯；酒精虽然让人快睡着，却会毁掉后半程的 REM。第四，卧室温度控制在 18~20 摄氏度，入睡需要核心体温下降，手脚放热是入睡信号，屋子太热会卡住这个过程。" },
      { h: "五、营养侧的助攻，不是安眠药", p: "色氨酸是血清素与褪黑素的前体，但它进入大脑需要和其它氨基酸竞争同一条转运通道，一小份复合碳水化合物能借胰岛素把竞争者请走，所以睡前一小碗燕麦或一小块全麦面包配少量蛋白质，比纯蛋白宵夜更利于入睡。镁参与 GABA 能神经的抑制过程，深绿色叶菜、坚果、全谷是日常来源。钙帮助大脑利用色氨酸，300 毫升奶可提供约 300 毫克钙。另外晚餐避免高脂大餐——高脂会延长消化时间、抬高核心体温，直接推迟入睡。" }
    ],
    points: [
      "深睡占总睡眠 13%~23%，REM 占 20%~25%，两个都达标才算睡好",
      "前半夜丢的是修复，后半夜丢的是情绪与记忆，补觉补不回深睡",
      "固定起床时间 + 晨光，比追求早点躺下更能校准节律",
      "酒精是 REM 的头号杀手，它会让人「睡着但不算休息」"
    ],
    bestline: "判断一段睡眠好不好的标准，不是躺了多久，而是身体有没有把该修的修完。",
    action: "今晚开始执行一件事：明早固定一个起床时间，连着七天不变，起床后到窗边站五分钟。一周后对比睡眠评分和深睡占比。"
  },

  {
    title: "静息心率：身体给你的一张诚实报表",
    lead: "它大概是所有指标里最不容易自欺欺人的一个。步数可以硬刷，睡眠可以躺久，但静息心率藏在深夜里悄悄量，反映的是你的心脏每次泵血有多省力——以及你的心血管系统在过去几周到底是变好了还是变差了。",
    sections: [
      { h: "一、它到底量的是什么", p: "静息心率指清醒状态下、身体完全安静时的最低心率区间，手表通常在睡眠和长时间静坐时取样。成年人常见范围 55~75 次/分，长期规律有氧训练者可低至 40~50。它的意义在于：心率 = 心输出量 ÷ 每搏输出量。当心肌收缩有力、每搏输出量大，维持同样的供血只需要更少次心跳，静息心率就下降。所以下降代表心脏变省力了，是心血管适能提升的直接信号。" },
      { h: "二、怎么判断自己的水平", p: "横向看，别人 49 次不代表你也该是 49，这是高度个体化的指标，重点看自己的长期趋势。纵向看，建议用四周滚动平均来读，单日波动意义有限。如果连续三天比自己的基线高出 5~8 次以上，通常说明身体正处在某种应激里：感染早期、睡眠债累积、脱水、情绪持续紧绷、过量训练后的恢复期，或者前一晚饮酒。这时候与其照常上强度，不如降一档。" },
      { h: "三、把它往下压的主力是有氧，不是力量", p: "真正让静息心率下降的是持续、中低强度的有氧刺激。每周 150 分钟中等强度（能说话但不能唱歌的强度），或 75 分钟较高强度，坚持 8~12 周通常可见下降 3~8 次。训练强度的分布很关键：大部分低强度有氧 + 每周一到两次高质量强度刺激，比天天中等强度「灰区训练」更有效，后者累积疲劳却不产生足够适能增益。" },
      { h: "四、生活习惯里几个影响最大的变量", p: "脱水会显著提高静息心率——血浆容量下降时，心脏只能靠加快频率维持输出，夏天或训练后补水不足，第二天静息心率上浮非常明显。酒精同样是常见的推手，它导致的脱水与交感兴奋能让人第二天早上高出 5~10 次。睡眠不足会让交感神经持续占优，静息心率随之抬升。另外久坐本身不推高静息心率，但它会通过降低整体适能间接把你推向更高的基线。" },
      { h: "五、营养维度：几件对心脏真的有用的事", p: "钠摄入过高抬血容量与血压，中国居民膳食指南建议每日食盐不超过 5 克，而实际人均摄入远高于此，外食和酱料是主要来源。钾有助拮抗钠的升压作用，蔬菜、水果、豆类、薯类是主力来源。Omega-3 脂肪酸（每周两次深海鱼，或亚麻籽油、核桃）对心律与炎症状态有益。镁参与心肌电活动稳定，全谷与坚果可日常补充。反过来，长期大量咖啡因在高敏感个体上会带来心悸与睡眠碎片化，后者又反过来推高静息心率。" }
    ],
    points: [
      "静息心率下降 = 心脏每搏输出量变大 = 心血管适能提升，是变好的信号",
      "单日看波动，四周滚动平均看趋势；连续高出基线 5~8 次，说明身体在应激",
      "脱水、饮酒、睡眠债是最常见的三个推手，通常第二天早上就看得出来",
      "真正压低它的是 8~12 周规律的每周 150 分钟有氧，没有捷径"
    ],
    bestline: "它不会因为你想表现得健康就变低——这正是它值得每天看一眼的原因。",
    action: "记下今天早上的静息心率作为基线，之后每周日上午看一次四周平均值。今晚先把水喝够：体重公斤数 × 30 毫升，分摊在下午之前喝完。"
  },

  {
    title: "HRV 心率变异性：你今天到底扛不扛得住",
    lead: "这是佳明数据里最容易被忽略、但也最有决策价值的一项。它不告诉你身体有多强，它告诉你身体现在还有多少余量可用。同样一份训练计划，在 HRV 高和低的早晨执行，效果可以完全是两回事。",
    sections: [
      { h: "一、变异性越高，反而越好", p: "很多人第一次听会搞反：心率整齐不是更健康吗？恰恰相反。健康心脏的节律是「不稳」的，两次心跳之间的毫秒级间隔随时在微调，这是迷走神经在持续煞车的痕迹。吸气时心率略快、呼气时略慢，这种呼吸性心律不整正是副交感张力良好的表现。当身体承受压力、疲劳、感染或过量训练时，交感占优、迷走退位，间隔变得整齐，HRV 就下降。所以 HRV 高 = 恢复良好、适应能力强；HRV 低 = 身体正在把资源调去应付某个麻烦。" },
      { h: "二、只看自己的基线，别比别人", p: "HRV 的绝对值差异极大，年龄是最大的影响因素，几十岁的个体差异可以相差数倍，横向对比毫无意义。有意义的做法是把每日测量和自己的长期基线比。常见读法：处在基线附近或之上，可以按计划执行；明显低于基线（比如跌出正常波动范围），说明恢复不充分，适合降强度或改为积极性恢复；如果连续多日走低且伴随静息心率抬升、睡眠变差，就要考虑是不是训练过量或早期的感染信号。" },
      { h: "三、测量要在同一条件下做", p: "HRV 对测量条件极其敏感，这也是它容易「显得不准」的原因。最标准的取样窗口是清晨刚醒、还没起身、排空膀胱后，静卧一分钟以上。身体的位置、前一刻的呼吸节奏、刚喝的水、翻身带来的活动都会改变读数。所以固定在同一时间同一姿势测量，比追求某一个精确数字重要得多——你要的是一条可比的曲线，而不是一个漂亮的值。" },
      { h: "四、哪些因素会把 HRV 压下去", p: "急性因素：睡眠不足和睡眠碎片化、饮酒（这是最猛的一个，第二天早上通常明显跳水）、单次高强度训练后的 24~48 小时、脱水、情绪性应激。慢性因素：长期训练负荷过高、持续热量缺口过大、慢性的心理压力。反过来能让它抬升的也很朴素：稳定的睡眠节律、规律的中低强度有氧、足够的能量摄入、以及呼吸训练——每分钟 5~6 次的慢呼吸（比如吸 4 秒呼 6 秒）可以直接刺激迷走神经，每天 5~10 分钟，坚持数周可见基线上移。" },
      { h: "五、把它变成当天的训练开关", p: "最实用的用法是做强度决策：早晨 HRV 处在基线附近以上，安排力量或间歇这类高质量训练；明显偏低时，把强度目标改成低强度有氧或拉伸放松，把高质量那次往后挪一天。这不是偷懒，而是把高质量的刺激放在身体真正能产生适应的窗口里——疲劳状态下硬上，刺激有了但超量恢复做不出来，等于白费。备考期、工作压力大的时候尤其适用：身体已经在应付别的负荷了。" }
    ],
    points: [
      "HRV 高 = 恢复好、适应能力强；低 = 身体正在应付某个麻烦",
      "绝对值没有意义，只能和自己长期基线比；固定晨起静卧测量才有可比性",
      "饮酒是 HRV 的头号杀手，睡眠碎片化和单次大强度训练紧随其后",
      "每天 5~10 分钟慢呼吸（吸 4 呼 6）能实实在在抬高基线"
    ],
    bestline: "HRV 不评价你有多强，它只是每天早上问一句：今天还有余量吗？",
    action: "明早醒来先别起身，静卧一分钟看 HRV。处在基线附近就按计划练，明显偏低就改成散步或拉伸——把强度留给身体真正接得住的那天。"
  },

  {
    title: "压力值与身体电量：看不见的能量账本",
    lead: "白天常常觉得「也没干什么却累」，身体电量这个指标就是为这种感觉做的可视化。它把心率变异性换算成一笔进出账：消耗是交感神经活动，补充是副交感占优的休息时段。看懂了流水，就知道电是哪漏掉的。",
    sections: [
      { h: "一、电是怎么充进来的", p: "夜间充电主要靠深睡和 REM 两个时段，深睡贡献的补给量最大。如果总时长够但深睡占比低，早上起来电量依然不满。反过来，有些人睡六小时电量也能充到 90 以上，通常就是深睡比例够高、夜里没有反复被打断。白天也有小额充电：静坐、冥想、慢走、听舒缓的音乐，只要心率变异性回升、压力值下降，系统就会记录到轻微的充电。这些零碎的小额充电在一天里累加起来相当可观。" },
      { h: "二、电是这样漏掉的", p: "消耗端最大的三笔支出：首先是高强度的身体活动，这是明面上的。其次是持续的心理压力——开会、赶材料、处理棘手的人际——这类支出隐蔽但持久，压力值可以连续几小时维持在中高位，而你可能只是坐在那儿没动。第三是被忽略的生理应激：缺水、饿太久导致的低血糖、过热的环境、咖啡因过量、以及饮酒后的代谢负担。很多人白天电量跳水找不到原因，八成在这第三类里。" },
      { h: "三、压力值的正确读法", p: "压力值本身不是坏东西，它是身体调动资源的正常反应。适度、短时的高压状态有助于专注和表现，真正有害的是「长时间没有回落」——连续三四小时压在中高位以上，说明自主神经没有获得任何喘息窗口。健康的形态是波动的：紧张一阵、随后能降下来。所以看的重点不是峰值有多高，而是高压之后能不能降回低位、一天里有没有足够的低压力时段。如果整天的曲线几乎贴在中间以上，晚上就该主动安排一段低刺激的时间。" },
      { h: "四、给自主神经一个下降信号", p: "最有效的即时工具是呼吸。把呼吸节奏放慢到每分钟 5~6 次（吸气 4 秒、呼气 6 秒，重点是呼气比吸气长），持续两到五分钟，迷走神经张力会明显上升，压力值会肉眼可见地往下走。原理是呼气时心率上升、吸气时下降的呼吸性心律不整，长呼气等于把副交感开关按得更久。开会前十分钟做一次，往往比硬撑有用得多。此外，冷水洗脸、站起来走动几分钟、把手脚放暖，也都是有效的下降信号。" },
      { h: "五、全天电量的营养账本", p: "从营养角度看，最容易造成电量莫名下跌的是血糖大幅波动。高糖高精碳水的早餐会让血糖快速上升随后快速回落，回落阶段伴随心慌、注意力涣散、压力值抬升，而当事人往往只觉得「困」。对策是早餐保证蛋白质（25~30 克）+ 复合碳水 + 少量脂肪，例如两个鸡蛋配燕麦加一小把坚果。第二件是水：轻度脱水即可造成心率上浮、自觉疲劳，夏季或长时间会议之间记得补水。第三是咖啡因的节奏：下午两点后停用，既是保电量也是保当晚的深睡。" }
    ],
    points: [
      "夜间充电主要靠深睡，深睡比例低时睡够时长也充不满",
      "白天的隐性消耗：持续心理压力、缺水、低血糖、咖啡因过量",
      "看压力值重点不是峰值，而是高压后能不能降回来",
      "呼气长于吸气的慢呼吸，是随时随地可用的下降开关"
    ],
    bestline: "累不累不看做了多少事，看的是这一整天里，自主神经有没有获得哪怕一次喘息。",
    action: "今天挑两个高压时段之间，做三分钟「吸 4 秒、呼 6 秒」的呼吸，然后回看这段时间的压力值有没有掉下来。"
  },

  {
    title: "步数与 NEAT：不动的时候，身体也在烧油",
    lead: "多数人把每天的消耗想成了「运动那一小时」，然而决定你一天总能量支出高低的，往往是剩下那十五六个小时里那些算不上运动的小动作。这部分叫非运动性活动产热，缩写 NEAT。它是体重管理里最被低估的一块。",
    sections: [
      { h: "一、一天的总消耗由四块组成", p: "基础代谢占 60%~70%，是你躺着不动也要花的能量，和体重、年龄、性别、肌肉量相关；食物热效应约占 10%，是消化吸收本身要消耗的能量，蛋白质这一项最高；运动性消耗差异极大，规律运动者可以到 15%~25%，久坐人群可能只有 5%；剩下的就是 NEAT，包括走路、站立、做家务、开会时的身体微调、甚至抖腿——它虽然有个缩写，本质上就是「除刻意运动以外的一切身体活动」。" },
      { h: "二、为什么 NEAT 的杠杆这么大", p: "NEAT 的个体差异可以达到每天几百千卡，而且它是最容易通过行为改变从而长期维持的一块。相比于此每小时消耗大但难以坚持的运动，NEAT 的优势在于「低门槛、高频次、可持续」。研究观察显示，在相同体重的人群里，倾向久坐者与活动量大者的每日总能量支出可以相差 500~800 千卡，这个差距绝大部分来自 NEAT，而不是来自谁每周多跑了几公里。换句话说，两个同样一周运动三次的人，日常的走动差别就能决定他们的体重走向。" },
      { h: "三、八千步是个合适的起点，不是终点", p: "很多健康建议提到的 10000 步其实是历史形成的营销数字，并非严格的科学阈值。对久坐人群来说，从日常三四千步提到 7000~8000 步，健康收益的增量最明显；再往上提升仍有好处，但边际收益递减。更有价值的做法不是追求某个数字，而是打破久坐的连续性：每坐 30~45 分钟起身活动 2~3 分钟，对血糖、血脂以及腰背状态的好处，比攒够步数却不间断地坐一天要实在得多。把「连续久坐时长」当作第二个看板指标。" },
      { h: "四、把 NEAT 设计进环境里，而不是靠意志", p: "意志力是不可靠资源，环境设计才是稳定的。几个低成本的调整：打印机放到需要走几步的位置；水杯换成小容量，倒水次数自然增加；接电话时站起来走一走；一站以内的路程步行；等等。这些动作单个消耗微不足道，但它们不需要决策、不需要额外时间，因而能长期持续，累加起来的总量相当可观。" },
      { h: "五、营养侧的配合：别把 NEAT 的成果吃回去", p: "增加活动量之后最常见的反噬是补偿性进食——今天多走了五千步，觉得可以奖赏自己一杯奶茶，结果一杯的 300~400 千卡就把全天的增量抵消了。补偿心理的另一面是无意识食欲上升，尤其当日常消耗突然增加时，要注意把蛋白质的量稳住（每天每公斤体重 1.0~1.2 克），蛋白带来的饱腹感能有效抑制这种自主补偿。另外，站立与走动增加后要同步补水，很多「增加活动后依然觉得累」的情况，其实是水没跟上。" }
    ],
    points: [
      "一天总消耗 = 基础代谢 60~70% + 食物热效应约 10% + 运动 + NEAT",
      "NEAT 个体差异可达每天几百千卡，是最容易被行为改变的一块",
      "比起攒够步数，打破「连续久坐」更有价值：每 45 分钟起身两三分钟",
      "活动量上升后的补偿性进食，是体重管理里最常见的翻车点"
    ],
    bestline: "决定体重的不是你练的那一个小时，而是你没在练的那十五个小时。",
    action: "今天开始设一个 45 分钟提醒，每次响就站起来走动两三分钟；顺手把水杯换成小杯。"
  },

  {
    title: "强度活动分钟：150 分钟到底怎么攒",
    lead: "多数运动指南都会提到「每周 150 分钟中等强度」，但几乎没人说清楚这 150 分钟要怎么分布、什么强度才算数、家务算不算。今天把这套规则讲透，你就能对着手表上的数字，判断自己这周到底攒够了没有。",
    sections: [
      { h: "一、中等和高强度的界线在哪", p: "最实用的判断方式有两个。一是谈话测试：中等强度下你能说话但不能唱歌，高强度下说完整句子已经困难。二是心率：中等强度约达到最大心率的 64%~76%，高强度约在 77%~95%。用 220 减去年龄估算最大心率是个粗略方法，手表按实测最大值估算会更贴合个体。国际通行的换算关系是：1 分钟高强度≈2 分钟中等强度，所以每周也可以只做 75 分钟高强度。" },
      { h: "二、为什么要加点高强度", p: "如果只有中等强度，心肺适能的提升会在一段时间后进入平台。每周安排一到两次高强度间歇，比如快走与慢跑交替、或者 4 分钟较快的爬坡接 3 分钟平路，循环四组，能在更短时间内带来更大的心肺适能增益。需要注意的是，高强度必须有低强度垫底：每周总量的大头仍应是中低强度有氧，高强度占比控制在两成以内。全是灰区中等强度、又不含高强度，是最常见的无效努力。" },
      { h: "三、零星时间也能攒，但要够长", p: "单次持续 10 分钟以上的活动才被计入有效时间，这是因为有氧适应性需要一定的持续时长才能触发。碎片化的两分钟走动虽然计入步数，但不会转化成强度活动分钟。好在一天里可以多次累加：早通勤快走 15 分钟、午休爬楼梯 10 分钟、傍晚慢跑 25 分钟，加起来就是 50 分钟中等强度。一周三次这样的安排，150 分钟就轻松达标了。" },
      { h: "四、家务和力量训练怎么算", p: "中等以上强度的家务是算数的，比如擦地、搬东西、照顾孩子时的持续活动，只要心率达到中等区间且持续十分钟以上。纯力量训练的情况比较特殊：它对肌肉与骨密度的价值无法被有氧替代，但因为每组之间有休息，心率并未全程维持在目标区间，所以计入的强度分钟有限。合理的做法是把它当作独立的必需项——每周至少两次，覆盖主要肌群，而不是指望它来凑有氧的 150 分钟。" },
      { h: "五、训练要把吃跟上，否则适能做不出来", p: "达到推荐运动量后，蛋白质需求随之上升：一般活动人群每天每公斤体重 1.0 克左右，规律运动者建议 1.2~1.6 克，增肌期可到 1.6~2.0 克。分布同样重要，每餐 25~35 克比集中在晚餐一顿更有利于肌肉蛋白合成。碳水化合物方面，单次中等强度运动在一小时内通常不需要额外补充，日常的均衡膳食足够；超过一小时或强度较高，可以每小时补充 30~60 克碳水。运动后半小时内来一份含蛋白与碳水的加餐，例如 300 毫升牛奶配一根香蕉，是简单有效的恢复组合。" }
    ],
    points: [
      "中等强度：能说话不能唱歌，约为最大心率 64%~76%；1 分钟高强度≈2 分钟中等",
      "每周 150 分钟中等或 75 分钟高强度，单次需持续 10 分钟以上才计入",
      "高强度每周一到两次就够，但七成以上仍应是中低强度",
      "规律运动后蛋白质目标提升到每天每公斤体重 1.2~1.6 克，并分散到三餐"
    ],
    bestline: "运动量决定你能练多快，吃进去的东西决定你能不能真的变强。",
    action: "今天安排 25 分钟中等强度快走或慢跑；练完后三十分钟内喝 300 毫升牛奶。"
  },

  {
    title: "蛋白质：一天到底该吃多少，怎么分才有用",
    lead: "这可能是营养里被问最多、也被误解最多的问题。多数人以为自己吃够了，但把三餐拆开算一算会发现：总量勉强够、分布却完全集中在晚餐——而偏偏分布这件事，决定了蛋白质能不能真的派上用场。",
    sections: [
      { h: "一、先算清楚自己的目标量", p: "健康成年人维持体重与基本生理功能，推荐摄入量约为每天每公斤体重 1.0 克；规律运动者 1.2~1.6 克；以增肌为主要目标的力量训练期可到 1.6~2.0 克；减脂期由于热量缺口存在，反而需要提高蛋白比例以保护瘦体重，常按目标体重每公斤 1.6~2.0 克安排。以一个体重 60 公斤、每周运动三四次的人为例，全天目标在 72~96 克之间。此外还有分布要求：每餐达到 25~35 克才足以有效刺激肌肉蛋白合成。" },
      { h: "二、为什么分布比总量更重要", p: "人体没有蛋白质的长期储备库。氨基酸在血液中的浓度升高后，肌肉蛋白合成会被激活并在数小时内回落，多余的氨基酸则被氧化供能或转为糖脂肪。这意味着三餐不均匀的典型模式——早餐只有碳水、午餐随便对付、晚餐集中吃大量肉——会造成白天两次无法启动合成，而晚餐那次超出需要的部分又被浪费。同样 90 克蛋白，分成每餐 30 克，利用率明显高于 10+20+60 的分配。" },
      { h: "三、每一餐三十克长什么样", p: "几个直观的换算：一个鸡蛋约 6~7 克蛋白，300 毫升牛奶约 9~10 克，100 克鸡胸肉约 24 克，100 克鱼类约 18~20 克，100 克北豆腐约 12 克，100 克瘦牛肉约 20 克。所以一顿合格的早餐可以是两个鸡蛋加一杯牛奶，约 22 克，再加一小份全麦主食把碳水补上；午餐一份手掌大小的鸡胸或鱼配半碗豆制品，轻松越过 30 克；晚餐以豆制品搭配少量肉类，既控制总量也降低饱和脂肪负担。" },
      { h: "四、植物蛋白与动物蛋白怎么搭配", p: "动物性蛋白氨基酸组成更接近人体需求，吸收利用率高；植物性蛋白多半存在某种限制氨基酸，比如谷物缺赖氨酸、豆类缺蛋氨酸。但这不意味着植物蛋白不好，关键在于互补：谷类和豆类同时摄入即可补齐各自短板，米饭配豆腐、馒头夹豆沙、杂粮配鹰嘴豆都是经典组合。以植物为主的人群建议适当把总量上调百分之十左右。同时注意，豆制品也是钙和镁的良好来源，获取的就不只是蛋白质。" },
      { h: "五、几个常被问到的顾虑", p: "健康人群不必担心肾功能：高蛋白对已有肾脏疾病者是负担，但没有证据显示它会损伤正常肾脏，真正需要注意的是同时保证充足饮水。肾病患者则应遵医嘱限制。第二，蛋白粉是补充手段而非必需品，只有当日常膳食确实吃不够、或者训练后不方便进食时才用，优先满足基础膳食。第三，过量摄入的那部分不会变成肌肉，会通过糖异生转为能量，长期大幅超过需求会挤占其它营养素的空间。" }
    ],
    points: [
      "活动人群每天每公斤体重 1.2~1.6 克，减脂或增肌期可到 1.6~2.0 克",
      "每餐 25~35 克才足以激活肌肉蛋白合成，早餐尤其容易不达标",
      "动物蛋白利用效率高，植物蛋白靠谷豆互补，总量可上调约一成",
      "肾功能正常者不必惧怕高蛋白，但要相应保证饮水量"
    ],
    bestline: "身体不会替你把早餐欠下的蛋白质留到晚上一起结算。",
    action: "今晚把明早的早餐定下来：两个鸡蛋加一杯牛奶（约 22 克蛋白），再加一份主食。"
  },

  {
    title: "上午十点的困：一条血糖曲线就能解释",
    lead: "很多人把上午的注意力涣散归咎于昨晚没睡好，但相当一部分案例的真正原因在早餐桌上。一份以精制碳水为主的早餐，会在一个多小时后把血糖送上一个陡峭的回落坡，而那个回落阶段的感觉，和困几乎一模一样。",
    sections: [
      { h: "一、那一口包子油条之后发生了什么", p: "精制米面、甜面包、含糖饮品这类食物的血糖生成指数高，进入肠道后被快速分解为葡萄糖吸收入血，血糖在 30~45 分钟内迅速攀升。胰腺随即分泌大量胰岛素把血糖转移进细胞，由于这批葡萄糖来得太快太多，胰岛素往往「用力过猛」，导致餐后一到两小时血糖反而跌到餐前水平之下，形成反应性低血糖。这个阶段大脑供能不足，表现就是注意力不集中、哈欠连天、心慌、想再来点甜的——很多人此时喝的那杯奶茶或拿铁，只是把自己送进了下一轮循环。" },
      { h: "二、曲线的形状比峰值更重要", p: "评价一份餐食对血糖的影响，看的不只是升到多高，更看它多久降回来、有没有形成陡峭的峰谷。同样的碳水量，配着蛋白质、膳食纤维和少量脂肪一起吃，胃排空速度会明显放慢，葡萄糖入血变得平缓，餐后曲线从过山车变成小土坡。这就是为什么早餐加了鸡蛋、配了蔬菜之后，整个上午的状态会稳定得判若两人。碳水化合物的质量同样关键：燕麦、荞麦、糙米、杂豆的升糖负荷远低于白米白面，红薯的纤维结构让它比同等甜度的点心友好得多。" },
      { h: "三、食物顺序也是个便宜的工具", p: "研究显示，同一份餐食，先吃蔬菜和蛋白质、最后吃主食，餐后血糖峰值可以明显低于先吃主食的顺序。原理不复杂：纤维和蛋白先在胃里形成一层延缓排空的基底，随后的碳水进入时被「拖慢」。这个方法不需要改变任何食材，只需要改变动筷子的顺序，几乎零成本。如果外食无法控制菜品结构，至少可以先把蔬菜那份吃掉。" },
      { h: "四、一小时内的轻度活动真的有效", p: "骨骼肌是消耗血糖的大户，肌肉收缩时会通过非胰岛素依赖的途径把葡萄糖转运进细胞。餐后半小时内起身走动 10~15 分钟，哪怕是收拾桌面、站着回复消息、在办公室里绕几圈，都能把餐后曲线的峰削掉一截。这个效应并不需要剧烈运动强度。所以对频繁出差或会议密集的人来说，把「饭后走一走」当作固定动作，性价比高于事后任何补救措施。" },
      { h: "五、把早餐搭成一个稳压组合", p: "一个值得照抄的模板：优质蛋白 25~30 克（两个鸡蛋、或一杯牛奶加一份豆制品）＋复合碳水（燕麦、全麦、杂粮粥、红薯，控制在自己一拳到两拳的分量）＋蔬菜或水果（提供纤维和多酚）＋少量坚果（提供脂肪与健康脂肪酸）。要尽量避免的是空腹甜食、纯果汁、以及把主食当全部的吃法。需要说明的是，每个人对同一种食物的血糖反应差异很大，如果有条件，连续几天观察自己餐后一小时的状态，比照任何通用榜单都可靠。" }
    ],
    points: [
      "精制碳水早餐后 1~2 小时的反应性低血糖，是上午犯困最常见的隐藏原因",
      "蛋白与纤维把胃排空放慢，血糖曲线从过山车变成小土坡",
      "先吃菜和肉、最后吃主食，零成本就能削平峰值",
      "餐后走动 10~15 分钟，肌肉会以非胰岛素途径直接消耗血糖"
    ],
    bestline: "上午的状态，往往在早餐端上桌的那一刻就已经被决定了。",
    action: "明天早餐按「蛋白 + 复合碳水 + 蔬果 + 一小把坚果」搭，先吃菜和蛋，主食放最后，然后对比这两个上午的精力。"
  },

  {
    title: "补水：最便宜的补剂，也是最容易被搞错的一项",
    lead: "它便宜、安全、几乎人人需要，但也正因如此，关于喝水的说法多到互相矛盾：八杯水是真的吗？喝多了会中毒吗？咖啡算不算水？今天把标准答案和它的边界一并说清楚。",
    sections: [
      { h: "一、每天到底要喝多少", p: "中国居民膳食指南建议成年男性每日饮水 1700 毫升、女性 1500 毫升，指的是饮水或茶水等液体总量，不包括食物中含水。运动人群有更实用的算法：在基础量之上，每运动一小时额外补充 400~700 毫升，具体看强度与环境。《中国居民膳食营养素参考摄入量》给出的适宜摄入量约为每公斤体重 30 毫升（含食物水）。最简单的判断标准其实不用算：尿液呈淡黄色、不口渴，通常就够了；尿色深如浓茶则说明明显缺位。" },
      { h: "二、脱水 2% 就已经开始掉性能", p: "很多人以为只有口渴到难受才算脱水，实际上体重因失水下降 2% 时，耐力表现、注意力与情绪状态就已经出现可测量的下降，而这时人往往还没有强烈口渴感。这也是为什么倡导「主动喝、少量多次」而不是「渴了再喝」——口渴机制的触发是滞后的，等到它响起来， 缺口已经形成了。建议的做法是把全天分成若干次，每次 150~200 毫升均匀分配，而不是一次性灌下 500 毫升。" },

      { h: "四、过量的边界确实存在", p: "水也不是越多越好。短时间内摄入远超过肾脏排泄能力的淡水，会引起稀释性低钠血症，也就是俗称的水中毒，轻则头痛恶心乏力，重则抽搐昏迷。肾功能正常者的每小时排泄上限约 800~1000 毫升，所以「少量多次」既是效率问题，也是安全问题。运动场景下尤其要注意：高强度出汗后只补白水不补电解质，同样会稀释血钠，这种情况下应当选择含钠的运动饮料或同时吃点咸的食物。" },

<script>
/* ===== 每日必看 · 面板逻辑 ===== */
(function () {
  "use strict";

  var DAYS = (window.__DAYS__ || []).slice().sort();
  var SRC = window.__DAYDATA__ = window.__DAYDATA__ || {};   // 按日期的个别数据
  var POOL = window.__POOL__ || {};                          // 知识内容池（按天自动选题）
  var OV = {};      // { date: { path: value } } 本机编辑层
  var cur = null;
  var editMode = false;
  var STORE_KEY = "mrb_override_v1";
  var LS_OK = (function () {
    try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; }
    catch (e) { return false; }
  })();

  /* ---------- 工具 ---------- */
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }
  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function weekdayOf(iso) {
    var p = iso.split("-");
    return ["周日", "周一", "周二", "周三", "周四", "周五", "周六"][
      new Date(+p[0], +p[1] - 1, +p[2]).getDay()
    ];
  }
  /* 全局唯一且跨设备一致的天序号，决定当天选出哪条池内容 */
  function dayIndex(iso) {
    var p = iso.split("-");
    return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000);
  }
  function pick(name, iso) {
    var arr = POOL[name] || [];
    if (!arr.length) return null;
    return arr[((dayIndex(iso) % arr.length) + arr.length) % arr.length];
  }
  /* 每日好书快读：按「第几期」顺序推进，锚定第 1 期对应 2026-09-07（《原则》） */
  var SEQ_ANCHOR = "2026-09-07";
  function pickSeq(name, iso) {
    var arr = POOL[name] || [];
    if (!arr.length) return null;
    var i = dayIndex(iso) - dayIndex(SEQ_ANCHOR);
    return arr[((i % arr.length) + arr.length) % arr.length];
  }
  function tomorrowHint(name, iso) {
    var arr = POOL[name] || [];
    if (!arr.length) return null;
    return arr[(((dayIndex(iso) + 1) % arr.length) + arr.length) % arr.length];
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function getPath(o, p) {
    var ks = String(p).split("."), c = o;
    for (var i = 0; i < ks.length; i++) { if (c == null) return undefined; c = c[ks[i]]; }
    return c;
  }
  function setPath(o, p, v) {
    var ks = String(p).split("."), c = o;
    for (var i = 0; i < ks.length - 1; i++) {
      var k = ks[i];
      if (c[k] == null) c[k] = /^\d+$/.test(ks[i + 1]) ? [] : {};
      c = c[k];
    }
    c[ks[ks.length - 1]] = v;
  }

  /* ---------- 编辑层持久化 ---------- */
  function loadOV() {
    try { OV = JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; } catch (e) { OV = {}; }
  }
  function saveOV() {
    if (!LS_OK) { toast("当前打开方式无法保存修改，请双击「启动面板.bat」打开"); return; }
    try { localStorage.setItem(STORE_KEY, JSON.stringify(OV)); } catch (e) { toast("本地存储写入失败"); }
  }
  function ovOf(date) { return OV[date] || (OV[date] = {}); }

  function merged(date) {
    var base = SRC[date] ? clone(SRC[date]) : {};
    var m = ovOf(date);
    Object.keys(m).forEach(function (p) { setPath(base, p, clone(m[p])); });
    return base;
  }
  function get(date, path) { return getPath(merged(date), path); }
  function set(date, path, val) {
    var m = ovOf(date);
    var parts = String(path).split(".");
    for (var i = 1; i < parts.length; i++) {
      var parent = parts.slice(0, i).join(".");
      if (m.hasOwnProperty(parent)) {
        var arr = m[parent];
        arr.forEach(function (_, idx) {
          Object.keys(arr[idx] || {}).forEach(function (k) {
            if (!m.hasOwnProperty(parent + "." + idx + "." + k)) m[parent + "." + idx + "." + k] = clone(arr[idx][k]);
          });
        });
        delete m[parent];
      }
    }
    m[path] = val;
    saveOV();
  }
  function setArray(date, arrPath, newArr) {
    var m = ovOf(date);
    Object.keys(m).forEach(function (k) {
      if (k === arrPath || k.indexOf(arrPath + ".") === 0) delete m[k];
    });
    m[arrPath] = clone(newArr);
    saveOV();
  }

  /* ---------- 可编辑片段 ---------- */
  function ed(k, val, ph, cls, tag) {
    var empty = (val == null || String(val).trim() === "");
    var t = tag || "span";
    return "<" + t + " class=\"ed " + (cls || "") + (empty ? " ed-ph" : "") +
      "\" data-k=\"" + esc(k) + "\" data-ph=\"" + esc(ph || "") + "\">" +
      esc(empty ? (ph || "") : val) + "</" + t + ">";
  }

  /* ---------- 长文渲染（整页版：导语 → 分节 → 要点 → 金句 → 落地动作） ---------- */
  function lf(it) {
    var o = "";
    if (it.lead) o += "<div class=\"lf-lead\">" + esc(it.lead) + "</div>";
    (it.sections || []).forEach(function (s) {
      o += (s.h ? "<div class=\"lf-h\">" + esc(s.h) + "</div>" : "") +
           "<p class=\"lf-p\">" + esc(s.p) + "</p>";
    });
    if ((it.points || []).length) {
      o += "<ul class=\"lf-ul\">" + it.points.map(function (p) {
        return "<li>" + esc(p) + "</li>";
      }).join("") + "</ul>";
    }
    if (it.bestline) o += "<div class=\"bestline\">“" + esc(it.bestline) + "”</div>";
    if (it.action) o += "<div class=\"takeaway\">🎯 " + esc(it.action) + "</div>";
    return o;
  }

  /* ---------- 内容更新机制 ----------
     手机装到桌面后没有地址栏、没有刷新按钮，iOS 还会直接恢复内存快照，
     所以必须主动去服务器比对日期索引，发现新一期就拉下来。 */
  var lastCheck = 0, checking = false, updText = "";

  function HHMM() {
    var d = new Date();
    return (d.getHours() < 10 ? "0" : "") + d.getHours() + ":" +
           (d.getMinutes() < 10 ? "0" : "") + d.getMinutes();
  }
  function setStatus(s) { updText = s; paintStatus(); }
  function paintStatus() {
    var el = document.getElementById("updStatus");
    if (el) el.innerHTML = updText || "";
  }
  function loadScript(url, cb) {
    var s = document.createElement("script");
    s.src = url;
    s.onload = function () { cb(null); };
    s.onerror = function () { cb(new Error("load fail")); };
    document.head.appendChild(s);
  }
  /* 重新拉一次日期索引（带时间戳，绕开一切缓存） */
  function probeDays(cb) {
    loadScript("data/days.js?probe=" + Date.now(), function (err) {
      cb(err ? null : (window.__DAYS__ || []).slice().sort());
    });
  }
  /* 比对服务器索引；有新日期就拉数据并重新渲染 */
  function checkUpdate(manual, cb) {
    if (window.__MOBILE_PACKED__) {
      if (manual) toast("这是离线单文件版，不会联网更新");
      cb && cb("packed"); return;
    }
    if (checking) { cb && cb("busy"); return; }
    checking = true;
    setStatus("<span class=\"upd-busy\">正在检查服务器…</span>");
    probeDays(function (serverDays) {
      lastCheck = Date.now();
      if (!serverDays || !serverDays.length) {
        checking = false;
        setStatus("<span class=\"upd-err\">检查失败：连不上服务器</span>");
        if (manual) toast("连不上服务器，请检查网络");
        cb && cb("error"); return;
      }
      var latest = serverDays[serverDays.length - 1];
      var fresh = serverDays.filter(function (d) { return DAYS.indexOf(d) < 0; });
      var toLoad = fresh.slice();
      if (latest && toLoad.indexOf(latest) < 0) toLoad.push(latest);  // 最新一期内容也可能被改写过

      var t0 = todayStr();
      var hasToday = serverDays.indexOf(t0) >= 0;
      var tail = hasToday ? "" :
        "<br><span class=\"upd-err\">今天（" + t0 + "）这一期还没生成，明早 8:00 自动更新</span>";

      if (!toLoad.length) {
        checking = false; DAYS = serverDays;
        setStatus("已是最新 · 服务器最新一期 <b>" + latest + "</b> · 检查于 " + HHMM() + tail);
        if (manual) toast(hasToday ? "已是最新：服务器最新一期就是 " + latest : "已是最新，今天这期明早 8:00 生成");
        cb && cb("noop"); return;
      }
      var left = toLoad.length, failed = 0;
      toLoad.forEach(function (d) {
        loadScript("data/" + d + ".js?probe=" + Date.now(), function (err) {
          if (err) failed++;
          if (--left) return;
          checking = false;
          DAYS = serverDays.slice();
          var t = todayStr();
          cur = DAYS.indexOf(t) >= 0 ? t : DAYS[DAYS.length - 1];
          document.getElementById("brandSub").textContent =
            "共 " + DAYS.length + " 期 ｜ " + DAYS[0] + " 起";
          render();
          setStatus((fresh.length
            ? "已更新到 <b>" + DAYS[DAYS.length - 1] + "</b> · 检查于 " + HHMM()
            : "已是最新 · 服务器最新一期 <b>" + latest + "</b> · 检查于 " + HHMM()) + tail);
          if (manual) toast(fresh.length ? "已拉取新内容：" + fresh.join("、") : "已是最新");
          cb && cb(fresh.length ? "updated" : "noop");
        });
      });
    });
  }
  /* 清掉离线缓存并重载（用于彻底解决「一直显示旧的」） */
  function hardReload() {
    if (navigator.serviceWorker && navigator.serviceWorker.controller) {
      navigator.serviceWorker.controller.postMessage({ type: "CLEAR" });
      setTimeout(function () { location.reload(); }, 600);
    } else if (window.caches && caches.keys) {
      caches.keys().then(function (ks) {
        return Promise.all(ks.map(function (k) { return caches.delete(k); }));
      }).then(function () { location.reload(); })
        .catch(function () { location.reload(); });
    } else { location.reload(); }
  }

  /* ---------- 模块定义 ---------- */
  var MODULES = [
    {
      id: "news", cls: "col-7 c-blue", icon: "📰", title: "每日早报",
      render: function (d, D) {
        var n = D.news || {}; var items = n.items || [];
        var out = "";
        if (!items.length) {
          out = "<div class=\"empty\">今日早报尚未生成，将在每天早上自动更新</div>";
        } else {
          out = items.map(function (it, i) {
            var b = "news.items." + i;
            return "<div class=\"news-block rowwrap\">" +
              "<div style=\"flex:1;min-width:0\">" +
                "<div class=\"news-hd\"><span class=\"no\">" + (it.no || (i + 1)) + "</span>" +
                  ed(b + ".title", it.title, "标题", "news-title") + "</div>" +
                ed(b + ".body", it.body, "（正文，点击填写）", "news-body", "div") +
                (it.comment ? "<div class=\"comment\">🐾 " + ed(b + ".comment", it.comment, "") + "</div>" : "") +
                (it.url ? "<div class=\"news-link\"><a href=\"" + esc(it.url) + "\" target=\"_blank\">查看原文 →</a></div>" : "") +
              "</div>" +
              "<button class=\"delbtn\" data-del=\"news.items." + i + "\">✕</button>" +
            "</div>";
          }).join("");
        }
        var w = n.weather;
        if (w) {
          out += "<div class=\"weather\">" +
            "<div class=\"w-top\">🌤️ " + ed("news.weather.city", w.city, "城市", "w-city") +
            " <span class=\"w-temp\">" + ed("news.weather.temp", w.temp, "温度") + "</span></div>" +
            ed("news.weather.note", w.note, "（天气提示）", "w-note", "div") +
          "</div>";
        }
        out += "<div class=\"addrow\" data-add=\"news.items\">＋ 添加一条要闻</div>";
        return out;
      },
      tpl: { no: "⑤", title: "新要闻", body: "", comment: "", url: "" }
    },

    {
      id: "quote", cls: "col-5 c-warm", icon: "💬", title: "今日一句",
      auto: true,
      render: function (d, D) {
        var it = pick("quote", d);
        if (!it) return "<div class=\"empty\">内容池为空</div>";
        return "<blockquote class=\"quote\">" + esc(it.text) + "</blockquote>" +
          "<div class=\"quote-by\">— " + esc(it.by) + "</div>" + lf(it);
      }
    },

    {
      id: "nutrition", cls: "col-4 c-green", icon: "🥗", title: "每日营养知识早报",
      auto: true,
      render: function (d, D) {
        var it = pick("nutrition", d);
        if (!it) return "<div class=\"empty\">内容池为空</div>";
        return "<div class=\"theme-tag\">今日主题 · " + esc(it.theme) + "</div>" +
          "<div class=\"lf-title\">" + esc(it.title) + "</div>" + lf(it);
      }
    },

    {
      id: "why", cls: "col-4 c-purple", icon: "💡", title: "每日一个为什么",
      auto: true,
      render: function (d, D) {
        var it = pick("why", d);
        if (!it) return "<div class=\"empty\">内容池为空</div>";
        return "<div class=\"why-q\">" + esc(it.q) + "</div>" + lf(it) +
          "<div class=\"chips\">" + (it.tags || []).map(function (tg) {
            return "<span class=\"chip\">" + esc(tg) + "</span>";
          }).join("") + "</div>";
      }
    },

    {
      id: "book", cls: "col-4 c-gold", icon: "📚", title: "每日好书快读",
      auto: true,
      render: function (d, D) {
        var it = pickSeq("book", d);
        if (!it) return "<div class=\"empty\">内容池为空</div>";
        var total = (POOL.book || []).length;
        var round = (it.no || 1) + " / " + total;
        return "<div class=\"book-head\">" +
            "<div class=\"book-cover\">" + esc(it.tag || "书") + "</div>" +
            "<div style=\"flex:1;min-width:0\">" +
              "<div class=\"book-no\">第 " + esc(it.no) + " 期 · 共 " + total + " 本</div>" +
              "<div class=\"book-title\">" + esc(it.title) + "</div>" +
              "<div class=\"book-author\">" + esc(it.author) + "</div>" +
            "</div></div>" +
          (it.chapters ? "<div class=\"book-chapters\">篇幅：" + esc(it.chapters) + "</div>" : "") +
          lf(it);
      }
    },

    {
      id: "astro", cls: "col-12 c-purple", icon: "🔮", title: "今日星盘 · 十二星座",
      render: function (d, D) {
        if (window.__renderAstro) return window.__renderAstro(d);
        return "<div class=\"empty\">星盘模块未加载（缺少 assets/astro.js）</div>";
      }
    },

    {
      id: "health", cls: "col-12 c-green", icon: "🏃", title: "健康日报",
      auto: function (D) { return !((D.health || {}).metrics || []).length; },
      render: function (d, D) {
        var h = D.health || {};
        var out = "";
        if (h.note) out += "<div class=\"src-note\">" + esc(h.note) + "</div>";
        var ms = h.metrics || [];
        if (ms.length) {
          out += "<div class=\"metric-grid\">" + ms.map(function (m, i) {
            var b = "health.metrics." + i;
            return "<div class=\"metric " + esc(m.status || "") + " rowwrap\">" +
              "<div style=\"flex:1;min-width:0\">" +
                "<div class=\"lb\">" + ed(b + ".label", m.label, "指标") + "</div>" +
                "<div class=\"vl\">" + ed(b + ".value", m.value, "—") +
                  "<span class=\"un\">" + ed(b + ".unit", m.unit, "") + "</span></div>" +
              "</div>" +
              "<button class=\"delbtn\" data-del=\"health.metrics." + i + "\">✕</button>" +
            "</div>";
          }).join("") + "</div>";
        }
        if (h.summary) out += ed("health.summary", h.summary, "", "para", "div");

        out += "<div class=\"sec-split\">今日深度解读 · 内容池自动轮换</div>";
        var it = pick("health", d);
        if (it) out += "<div class=\"lf-title\">" + esc(it.title) + "</div>" + lf(it);
        else out += "<div class=\"empty\">健康解读内容池为空</div>";

        var adv = h.advice || [];
        if (adv.length) {
          out += "<div class=\"sec-split\">今日行动清单</div><ul class=\"advice\">" + adv.map(function (a, i) {
            return "<li class=\"rowwrap\"><span>" + ed("health.advice." + i, a, "建议") + "</span>" +
              "<button class=\"delbtn\" data-del=\"health.advice." + i + "\">✕</button></li>";
          }).join("") + "</ul>";
        }
        out += "<div class=\"addrow\" data-add=\"health.metrics\">＋ 添加指标</div>" +
               "<div class=\"addrow\" data-add=\"health.advice\">＋ 添加建议</div>";
        return out;
      }
    },

    {
      id: "schedule", cls: "col-12 c-orange", icon: "📅", title: "日程与待办",
      render: function (d, D) {
        var s = D.schedule || {}; var items = s.items || [];
        if (!items.length) return "<div class=\"empty\">当日暂无日程</div>" +
          "<div class=\"addrow\" data-add=\"schedule.items\">＋ 添加待办</div>";
        return "<div class=\"todo-grid\">" + items.map(function (it, i) {
          var b = "schedule.items." + i;
          return "<div class=\"todo " + (it.done ? "done" : "") + "\">" +
            "<span class=\"ck\" data-toggle=\"" + b + ".done\">" + (it.done ? "✓" : "") + "</span>" +
            "<span class=\"tm\">" + ed(b + ".time", it.time, "时间") + "</span>" +
            "<span class=\"tx\" style=\"flex:1\">" + ed(b + ".text", it.text, "事项") + "</span>" +
            "<button class=\"delbtn\" data-del=\"" + b + "\">✕</button>" +
          "</div>";
        }).join("") + "</div><div class=\"addrow\" data-add=\"schedule.items\">＋ 添加待办</div>";
      },
      tpl: { time: "待定", text: "新待办事项", done: false }
    }
  ];

  /* ---------- 主渲染 ---------- */
  function render() {
    if (!cur) return;
    var D = merged(cur);
    document.getElementById("heroDate").firstChild.nodeValue = cur;
    document.getElementById("heroWeek").textContent = (D.weekday || weekdayOf(cur));
    var g = document.querySelector("[data-k='greeting']");
    var gv = D.greeting || "";
    g.className = "hero-line ed" + (gv ? "" : " ed-ph");
    g.textContent = gv || "（点击“编辑”填写今日寄语）";

    var meta = [];
    if (D.generatedAt) meta.push("更新于 " + esc(D.generatedAt));
    var auto = MODULES.filter(function (m) { return m.auto; }).length;
    meta.push("知识类 " + auto + " 模块按日自动轮换，不重复");
    var m = ovOf(cur);
    if (Object.keys(m).length) meta.push("✎ 本机已改 " + Object.keys(m).length + " 处");
    if (!LS_OK) meta.push("<span style=\"color:#c0392b\">⚠ 当前打开方式无法保存编辑，请双击「启动面板.bat」</span>");
    document.getElementById("heroMeta").innerHTML = meta.join("<br>");
    paintStatus();

    document.getElementById("grid").innerHTML = MODULES.map(function (mo) {
      var body;
      try { body = mo.render(cur, D); } catch (e) { body = "<div class=\"empty\">渲染出错：" + esc(e.message) + "</div>"; }
      var sub = D[mo.id] || {};
      var isAuto = typeof mo.auto === "function" ? mo.auto(D) : mo.auto;
      return "<section class=\"card " + mo.cls + "\">" +
        "<div class=\"card-head\">" +
          "<div class=\"card-ico\">" + mo.icon + "</div>" +
          "<div class=\"card-title\">" + mo.title + "</div>" +
          (isAuto ? "<span class=\"badge add\">内容池·自动轮换</span>"
                  : (sub.note ? "<div class=\"card-note\">" + esc(sub.note) + "</div>" : "")) +
        "</div>" + body +
      "</section>";
    }).join("");

    var handlers = {
      "news.items": { no: "⑤", title: "新要闻", body: "", comment: "", url: "" },
      "health.metrics": { label: "指标", value: "—", unit: "", status: "mid" },
      "health.advice": "新建议（点击编辑）",
      "schedule.items": { time: "待定", text: "新待办事项", done: false }
    };
    Array.prototype.forEach.call(document.querySelectorAll("[data-add]"), function (el) {
      el.onclick = function () {
        var p = el.getAttribute("data-add"), t = handlers[p];
        if (!t) return;
        var arr = get(cur, p) || [];
        arr.push(typeof t === "string" ? t : clone(t));
        setArray(cur, p, arr);
        render(); toast("已添加，可直接编辑");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-del]"), function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        var p = el.getAttribute("data-del");
        var i = +p.split(".").pop(), arrPath = p.substring(0, p.lastIndexOf("."));
        var arr = get(cur, arrPath) || [];
        arr.splice(i, 1);
        setArray(cur, arrPath, arr);
        render(); toast("已删除");
      };
    });
    Array.prototype.forEach.call(document.querySelectorAll("[data-toggle]"), function (el) {
      el.onclick = function (e) {
        e.stopPropagation();
        var p = el.getAttribute("data-toggle");
        set(cur, p, !get(cur, p));
        render();
      };
    });
    bindEditables();
    syncNav();
  }

  /* ---------- 就地编辑 ---------- */
  function bindEditables() {
    var els = document.querySelectorAll(".ed");
    Array.prototype.forEach.call(els, function (el) {
      el.onclick = function (e) {
        if (!editMode) return;
        e.stopPropagation();
        if (el.getAttribute("contenteditable")) return;
        if (el.classList.contains("ed-ph")) { el.textContent = ""; el.classList.remove("ed-ph"); }
        Array.prototype.forEach.call(els, function (o) { o.removeAttribute("contenteditable"); });
        el.setAttribute("contenteditable", "plaintext-only");
        if (el.getAttribute("contenteditable") !== "plaintext-only") el.setAttribute("contenteditable", "true");
        el.focus();
        document.getSelection && document.getSelection().selectAllChildren(el);
      };
      if (!el._bound) {
        el._bound = true;
        el.addEventListener("blur", function () {
          var ce = el.getAttribute("contenteditable");
          if (ce !== "true" && ce !== "plaintext-only") return;
          el.removeAttribute("contenteditable");
          var v = el.textContent.trim();
          if (!v) { el.textContent = el.getAttribute("data-ph") || ""; el.classList.add("ed-ph"); v = ""; }
          set(cur, el.getAttribute("data-k"), v);
          toast("已保存");
        });
        el.addEventListener("keydown", function (ev) {
          if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); el.blur(); }
          if (ev.key === "Escape") { el.textContent = get(cur, el.getAttribute("data-k")) || ""; el.blur(); }
        });
      }
    });
  }

  /* ---------- 日期导航 ---------- */
  function syncNav() {
    var sel = document.getElementById("dateSel");
    sel.innerHTML = DAYS.slice().reverse().map(function (d) {
      var p = d.split("-");
      return "<option value=\"" + d + "\"" + (d === cur ? " selected" : "") + ">" +
        parseInt(p[1], 10) + "月" + parseInt(p[2], 10) + "日 " + weekdayOf(d) + "</option>";
    }).join("");
    var i = DAYS.indexOf(cur);
    document.getElementById("btnPrev").disabled = i <= 0;
    document.getElementById("btnNext").disabled = i < 0 || i >= DAYS.length - 1;
  }
  function go(d) { cur = d; render(); }

  var tt;
  function toast(msg) {
    var el = document.getElementById("toast");
    el.textContent = msg; el.classList.add("show");
    clearTimeout(tt); tt = setTimeout(function () { el.classList.remove("show"); }, 1600);
  }

  function loadAll(cb) {
    if (window.__MOBILE_PACKED__) { cb(); return; }   // 单文件手机版：数据已内联
    if (!DAYS.length) { cb(); return; }
    var left = DAYS.length, v = window.__ASSET_VER__ || Date.now();
    if (!left) { cb(); return; }
    DAYS.forEach(function (d) {
      var s = document.createElement("script");
      s.src = "data/" + d + ".js?v=" + v;
      s.onload = s.onerror = function () { if (--left === 0) cb(); };
      document.head.appendChild(s);
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    loadOV();
    document.getElementById("footPath").textContent = "C:/Users/wangw/WorkBuddy/Claw/每日必看/data/";
    if (!window.__MOBILE_PACKED__ && "serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "127.0.0.1")) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
    loadAll(function () {
      var t = todayStr();
      cur = DAYS.indexOf(t) >= 0 ? t : DAYS[DAYS.length - 1];
      document.getElementById("brandSub").textContent =
        "共 " + DAYS.length + " 期 ｜ " + DAYS[0] + " 起";
      render();
    });

    document.getElementById("dateSel").onchange = function () { go(this.value); };
    document.getElementById("btnPrev").onclick = function () {
      var i = DAYS.indexOf(cur); if (i > 0) go(DAYS[i - 1]);
    };
    document.getElementById("btnNext").onclick = function () {
      var i = DAYS.indexOf(cur); if (i < DAYS.length - 1) go(DAYS[i + 1]);
    };
    document.getElementById("btnToday").onclick = function () {
      var t = todayStr();
      if (DAYS.indexOf(t) >= 0) go(t); else toast("今天还没有生成内容，请等待早上自动更新");
    };
    document.getElementById("btnEdit").onclick = function () {
      editMode = !editMode;
      document.body.classList.toggle("editmode", editMode);
      this.classList.toggle("on", editMode);
      this.textContent = editMode ? "✓ 完成编辑" : "✎ 编辑";
      toast(editMode ? "编辑模式：点击任意文字即可修改" : "已退出编辑");
    };
    document.getElementById("btnReset").onclick = function () {
      if (!confirm("恢复 " + cur + " 的当日原始内容？本机手动修改将被清除。")) return;
      delete OV[cur]; saveOV(); render(); toast("已复原");
    };
    document.getElementById("btnPrint").onclick = function () { window.print(); };

    /* ---- 更新：手动按钮 / 自动检查 / 下拉刷新 ---- */
    document.getElementById("btnRefresh").onclick = function () {
      var longPress = this._armed;
      if (longPress) { hardReload(); return; }
      checkUpdate(true);
    };
    // 长按「更新」2 秒 = 强制清缓存重载
    (function () {
      var btn = document.getElementById("btnRefresh"), timer = null;
      btn.addEventListener("touchstart", function () {
        timer = setTimeout(function () { btn._armed = true; hardReload(); }, 2000);
      }, { passive: true });
      ["touchend", "touchcancel"].forEach(function (ev) {
        btn.addEventListener(ev, function () { clearTimeout(timer); }, { passive: true });
      });
    })();

    // 从后台切回前台、或 iOS 恢复内存快照时自动检查
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && Date.now() - lastCheck > 600000) checkUpdate(false);
    });
    window.addEventListener("pageshow", function (e) {
      if (e.persisted && Date.now() - lastCheck > 600000) checkUpdate(false);
    });
    // 打开页面 3 秒后静默检查一次；之后每 30 分钟
    setTimeout(function () { checkUpdate(false); }, 3000);
    setInterval(function () {
      if (document.visibilityState === "visible") checkUpdate(false);
    }, 1800000);

    // 顶部下拉刷新（手机）
    var startY = 0, pulling = false;
    document.addEventListener("touchstart", function (e) {
      if (window.scrollY <= 0 && e.touches.length === 1) { startY = e.touches[0].clientY; pulling = true; }
    }, { passive: true });
    document.addEventListener("touchmove", function (e) {
      if (!pulling) return;
      if (e.touches[0].clientY - startY > 80) { pulling = false; checkUpdate(true); }
    }, { passive: true });
    document.addEventListener("touchend", function () { pulling = false; }, { passive: true });
  });
})();

</script>
</body>
</html>
